<!--
  HOW TO SET UP THE ASTRA HEADER BUILDER
  =======================================
  Go to: Appearance > Customize > Header Builder

  PRIMARY HEADER ROW layout:
  ┌────────────────────────────────────────────────────────────────┐
  │  LEFT ZONE        │  CENTER ZONE    │  RIGHT ZONE             │
  │  [Site Identity]  │  [Primary Menu] │  [Search]               │
  └────────────────────────────────────────────────────────────────┘

  SITE IDENTITY settings:
  - Disable "Site Tagline"
  - Type the site title text as: NSWPEDIA.NET
  - No logo image needed (text only)

  PRIMARY MENU settings:
  - Menu: select your main nav menu (with the 3 items + icons above)
  - Submenu: Flyout / Hover
  - Mobile menu: Hamburger

  SEARCH settings:
  - Style: "Classic" (always visible inline input — NOT the icon-only style)
  - Placeholder text: Site search
  - Width: 240px (set in the search component width field)

  ABOVE HEADER ROW:
  - Leave empty (the amber line is CSS border-top, not a separate row)

  PRIMARY HEADER BG color: #ffffff
  Header Height: 72px

  MOBILE BREAKPOINT: 921px (Astra default)
-->
